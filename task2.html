<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб 3. Задание 2 — Вертикальное меню с выпадающими подменю</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .menu {
            width: 250px;
            background: #2c3e50;
            border-radius: 5px;
            overflow: hidden;
        }
        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-bottom: 1px solid #34495e;
        }
        .menu a:hover {
            background: #3498db;
        }
        .has-submenu {
            position: relative;
        }
        .submenu {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            width: 220px;
            background: #34495e;
            z-index: 100;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .has-submenu:hover .submenu {
            display: block;
        }
        .submenu a {
            border-bottom: 1px solid #2c3e50;
        }
        .submenu a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Вертикальное меню с выпадающими подменю</h1>
    <div class="menu">
        <a href="#">Главная</a>
        <div class="has-submenu">
            <a href="#">Отделы продаж ▸</a>
            <div class="submenu">
                <a href="#">ООО "Дизайн"</a>
                <a href="#">ООО "Арт"</a>
                <a href="#">ООО "Фотостиль"</a>
            </div>
        </div>
        <div class="has-submenu">
            <a href="#">Поставщики ▸</a>
            <div class="submenu">
                <a href="#">Книги</a>
                <a href="#">Канцелярия</a>
                <a href="#">Электроника</a>
            </div>
        </div>
        <a href="#">Наши услуги</a>
        <a href="#">Контакты</a>
        <a href="#">О нас</a>
    </div>
    <p style="margin-top:20px;">Наведите на пункты с ▸ чтобы увидеть подменю. Построено на float/position без flex/grid.</p>
<p style="text-align:center; margin-top:30px;"><a href="index.html" style="color:#3498db; font-size:16px;">← Назад к списку заданий</a></p>
</body>
</html>
